<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Order Dashboard</title>
<style>
:root{--bg:#0d1a12;--card:#14281b;--line:#24402d;--g:#3fae5f;--tx:#e6f0e8;--mu:#8fa897;--am:#e0a030;--rd:#d65a4a;--bl:#4a90c8}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#0a140e;border-bottom:2px solid var(--g)}
h1{font-size:19px;margin:0}h1 small{color:var(--mu);font-weight:400;font-size:12px;margin-left:8px}
main{max-width:1200px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.stat b{display:block;font-size:28px}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{background:#0f2016;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit}
button{cursor:pointer}button.p{background:var(--g);color:#06150b;font-weight:700;border:0}
button.s{padding:5px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid}
.Open{color:var(--bl)}.InProgress{color:var(--g)}.WaitingParts{color:var(--am)}.Completed{color:var(--mu)}.High{color:var(--rd)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--g);border-radius:12px;width:min(680px,95vw);padding:18px}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.hit{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:4px}
.hit div{padding:6px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}.hit div:hover{background:#1d3a28}
.hit code{color:var(--g);margin-right:6px}
#note{color:var(--am);font-size:12px}
@media(max-width:560px){.f{grid-template-columns:1fr}}
.nav button{margin-left:6px}.nav .on{background:var(--g);color:#06150b;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}.tabs button{border-radius:7px 7px 0 0;border-bottom:0}.tabs .on{background:var(--g);color:#06150b;font-weight:700}
.warn{background:#2a2410;border:1px solid var(--am);color:var(--am);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.rf{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.rf label{display:block;font-size:12px;color:var(--mu)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--g)}.mb{height:8px;background:var(--g);border-radius:4px;min-width:2px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;margin:0 8px 8px 0}
@media print{.nav,.tabs,.rf,.warn{display:none}body{background:#fff;color:#000}header,.stats,.bar,button{display:none}.panel h3{color:#000}}
</style></head><body>
<header><h1>🚛 Work Order Dashboard<small id="mode"></small></h1><div class="nav"><button id="nd" class="on">Dashboard</button><button id="na">⚙ Admin</button> <span id="who"></span> <button id="auth" class="s">Sign in</button></div></header>
<main>
<div id="note"></div>
<div id="nocodes" class="warn" hidden>No work plan codes loaded yet. Choose your <b>VSCOS_WORK_PLANS.xlsx</b>: <input type="file" id="xf" accept=".xlsx,.xls,.csv"></div>
<section id="v-dash">
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" placeholder="Search WO #, vehicle, code, description…" style="flex:1;min-width:200px">
<select id="fs"><option value="">All status</option><option>Open</option><option>In Progress</option><option>Waiting Parts</option><option>Completed</option></select>
<button class="p" id="new">+ New Work Order</button></div>
<div class="wrap"><table><thead><tr><th>WO #</th><th>Date</th><th>Vehicle</th><th>Plan Code</th><th>Description</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section id="v-admin" hidden>
<div class="warn">Admin is open — no password yet. Anyone with the page link can use it.</div>
<div class="tabs"><button data-t="rep" class="on">📊 Reports</button><button data-t="veh">🚚 Vehicles</button><button data-t="dat">💾 Data</button></div>
<div id="t-rep">
<div class="rf"><div><label>From</label><input type="date" id="rf"></div><div><label>To</label><input type="date" id="rt"></div>
<div><label>Vehicle</label><select id="rv"></select></div><div><label>System</label><select id="rs"></select></div>
<div><label>Status</label><select id="rst"><option value="">All</option><option>Open</option><option>In Progress</option><option>Waiting Parts</option><option>Completed</option></select></div>
<button id="rcsv">Export CSV</button><button id="rprint" class="p">Print</button></div>
<div class="stats" id="rsum"></div><div class="grid2" id="rout"></div>
</div>
<div id="t-veh" hidden><div class="rf"><div><label>Add vehicle / unit</label><input id="nv" placeholder="e.g. Ram 3500 #1"></div><button class="p" id="addv">Add</button></div><div id="vlist"></div></div>
<div id="t-dat" hidden><div class="rf"><button id="exj">Export backup (JSON)</button><button id="imb">Import backup…</button><input type="file" id="imf" accept=".json" hidden><button id="clr" style="border-color:var(--rd);color:var(--rd)">Delete ALL work orders</button></div><div id="dmsg" style="color:var(--mu)"></div></div>
</section>
</main><datalist id="vl"></datalist>
<dialog id="dlg"><form method="dialog" id="form" class="f">
<div class="w"><b id="dt">New Work Order</b></div>
<div><label>Vehicle / Unit</label><input id="veh" required list="vl" placeholder="e.g. Ram 3500 #1"></div>
<div><label>Odometer / Hours</label><input id="odo" type="number"></div>
<div><label>System (VSC 01–43)</label><select id="sys"></select></div>
<div><label>Work Plan Type</label><select id="typ"><option value="">Any</option><option>MANT</option><option>PREV</option><option>INSP</option><option>MINR</option><option>OTHR</option><option>OTIS</option></select></div>
<div class="w"><label>Find work plan code</label><input id="cs" placeholder="Search code or description…"><div class="hit" id="hit"></div></div>
<div class="w"><label>Selected work plan</label><input id="sel" readonly required placeholder="Pick a code above"></div>
<div><label>Priority</label><select id="pri"><option>Routine</option><option>High</option><option>Down / Out of Service</option></select></div>
<div><label>Status</label><select id="st"><option>Open</option><option>In Progress</option><option>Waiting Parts</option><option>Completed</option></select></div>
<div><label>Labor hours</label><input id="lab" type="number" step="0.1"></div>
<div><label>Parts / cost ($)</label><input id="cost" type="number" step="0.01"></div>
<div class="w"><label>Parts used / notes</label><textarea id="nt" rows="3"></textarea></div>
<div class="w"><button class="p" id="save" type="button">Save</button> <button type="button" id="del" class="s">Delete</button> <button type="button" id="x">Cancel</button></div>
</form></dialog>
<script>window.onerror=function(m){document.body.insertAdjacentHTML("afterbegin","<pre style=\"color:#f88;padding:10px\">Script error: "+m+"</pre>")};</script>
<script>
if(typeof CODES==="undefined"){try{var _c=localStorage.getItem("codes");window.CODES=_c?JSON.parse(_c):[]}catch(e){window.CODES=[]}}
</script>
<script type="module">
/* ====== PASTE YOUR FIREBASE CONFIG HERE (Project settings → Your apps). Leave apiKey empty to run local-only. ====== */
const firebaseConfig={apiKey:"",authDomain:"",projectId:"",appId:""};
const SYS={"01":"Engine","02":"Ignition","03":"Emission","04":"Cooling","05":"Fuel / Air","06":"Charging / Battery","07":"Exhaust","08":"Electrical","09":"Lighting","10":"Starting","11":"Clutch","12":"Transmission","13":"Transfer Case","14":"Power Take Off","15":"Drive Line","16":"Differential / Axle","17":"Suspension","18":"Wheel / Tire","19":"Steering","20":"Brakes","21":"Warning Devices","22":"Air System","23":"Hydraulic","24":"Air Conditioning","25":"Heater / Defroster","26":"Wiper","27":"Meters / Gauges","28":"Chassis / Frame","29":"Body","30":"Winch","31":"Towing Device","32":"Outrigger","33":"User Supplied","34":"Periodic Inspection","35":"Periodic Inspection (Specific)","36":"Fuel Servicing","37":"Fire Fighting","38":"Distribution / De-icer","39":"Sweeper","40":"Construction","41":"463L / MHE","42":"Boom","43":"Customer Service / Misc"};
const $=id=>document.getElementById(id);let WO=[],cur=null,db=null,fb=null,user=null,filt="";
const live=!!firebaseConfig.apiKey;
const mem={};const store={get(k="wo"){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
function showErr(m){const n=document.getElementById("note");n.style.color="#d65a4a";n.textContent="Error: "+m}
window.addEventListener("error",e=>showErr(e.message));window.addEventListener("unhandledrejection",e=>showErr(e.reason&&e.reason.message||e.reason));
$("mode").textContent=live?"Firebase sync":"Local mode";
if(!live)$("note").textContent="Local-only mode (saved in this browser). Add your Firebase config in the script to sync across devices.";
$("sys").innerHTML='<option value="">All systems</option>'+Object.entries(SYS).map(([k,v])=>`<option value="${k}">${k} – ${v}</option>`).join("");
async function init(){
if(live){
const A=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
Au=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
F=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
const app=A.initializeApp(firebaseConfig),auth=Au.getAuth(app);db=F.getFirestore(app);fb={Au,F,auth};
$("auth").onclick=()=>user?Au.signOut(auth):Au.signInWithPopup(auth,new Au.GoogleAuthProvider());
Au.onAuthStateChanged(auth,u=>{user=u;loadFleet();$("who").textContent=u?u.displayName||u.email:"";$("auth").textContent=u?"Sign out":"Sign in";
if(u)F.onSnapshot(F.query(F.collection(db,"users",u.uid,"workOrders"),F.orderBy("num","desc")),s=>{WO=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
else{WO=[];draw()}});
}else{$("auth").style.display="none";loadFleet();WO=JSON.parse(store.get()||"[]");draw()}
}
function draw(){
const q=$("q").value.toLowerCase(),s=$("fs").value||filt;
const c={Open:0,"In Progress":0,"Waiting Parts":0,Completed:0};WO.forEach(w=>c[w.status]++);
$("stats").innerHTML=Object.entries(c).map(([k,v])=>`<div class="stat" data-s="${k}"><b>${v}</b><span>${k}</span></div>`).join("")+`<div class="stat" data-s=""><b>${WO.length}</b><span>All</span></div>`;
$("stats").querySelectorAll(".stat").forEach(e=>e.onclick=()=>{$("fs").value=e.dataset.s;draw()});
$("rows").innerHTML=WO.filter(w=>(!s||w.status==s)&&(!q||JSON.stringify(w).toLowerCase().includes(q))).map(w=>`<tr><td>WO-${w.num}</td><td>${w.date}</td><td>${w.vehicle}</td><td><code>${w.code}</code></td><td>${w.desc}</td><td class="${w.priority=="Routine"?"":"High"}">${w.priority}</td><td><span class="tag ${w.status.replace(" ","")}">${w.status}</span></td><td><button class="s" data-id="${w.id}">Open</button></td></tr>`).join("")||'<tr><td colspan="8" style="color:var(--mu)">No work orders yet.</td></tr>';
$("rows").querySelectorAll("button").forEach(b=>b.onclick=()=>edit(WO.find(w=>w.id==b.dataset.id)));
afterDraw();
}
function hits(){
const q=$("cs").value.toLowerCase(),sy=$("sys").value,t=$("typ").value;
const r=CODES.filter(c=>(!sy||c[1].startsWith(sy))&&(!t||c[0]==t)&&(!q||(c[1]+" "+c[2]+" "+c[3]).toLowerCase().includes(q))).slice(0,60);
$("hit").innerHTML=r.map(c=>`<div data-k="${c[0]}|${c[1]}|${c[3]}"><code>${c[1]}</code>${c[3]} <small style="color:var(--mu)">[${c[0]}]</small></div>`).join("")||"<div>No match</div>";
$("hit").querySelectorAll("div[data-k]").forEach(d=>d.onclick=()=>{const[t,k,ds]=d.dataset.k.split("|");$("sel").value=`${k} – ${ds}`;$("sel").dataset.t=t;$("sel").dataset.k=k;$("sel").dataset.d=ds});
}
["cs","sys","typ"].forEach(i=>$(i).oninput=hits);$("q").oninput=draw;$("fs").onchange=draw;
function edit(w){cur=w||null;$("dt").textContent=w?`Work Order WO-${w.num}`:"New Work Order";
const g=(i,v)=>$(i).value=v??"";g("veh",w?.vehicle);g("odo",w?.odometer);g("pri",w?.priority||"Routine");g("st",w?.status||"Open");g("lab",w?.labor);g("cost",w?.cost);g("nt",w?.notes);g("cs","");g("sys","");g("typ","");
g("sel",w?`${w.code} – ${w.desc}`:"");$("sel").dataset.k=w?.code||"";$("sel").dataset.d=w?.desc||"";$("sel").dataset.t=w?.type||"";
$("del").style.display=w?"":"none";hits();$("dlg").showModal()}
$("new").onclick=()=>edit();$("x").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
if(!$("veh").value||!$("sel").dataset.k)return alert("Vehicle and a work plan code are required.");
if(live&&!user)return alert("Sign in first.");
const o={vehicle:$("veh").value,odometer:$("odo").value,code:$("sel").dataset.k,desc:$("sel").dataset.d,type:$("sel").dataset.t,system:$("sel").dataset.k.slice(0,2),priority:$("pri").value,status:$("st").value,labor:$("lab").value,cost:$("cost").value,notes:$("nt").value};
if(cur)Object.assign(cur,o);else{const num=(Math.max(1000,...WO.map(w=>w.num))+1);Object.assign(o,{num,date:new Date().toISOString().slice(0,10),id:String(Date.now())});cur=o;WO.unshift(o)}
if(live){const{F}=fb,col=F.collection(db,"users",user.uid,"workOrders"),{id,...d}=cur;
await F.setDoc(F.doc(col,String(cur.num)),d)}
else store.set("wo",JSON.stringify(WO));
$("dlg").close();draw()};
$("del").onclick=async()=>{if(!cur||!confirm("Delete this work order?"))return;
if(live){const{F}=fb;await F.deleteDoc(F.doc(db,"users",user.uid,"workOrders",String(cur.num)))}
else{WO=WO.filter(w=>w!==cur);store.set("wo",JSON.stringify(WO))}
$("dlg").close();draw()};
/* ===== ADMIN + REPORTS ===== */
let FLEET=[];
const money=n=>"$"+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
async function loadFleet(){
if(live){FLEET=[];if(user){const{F}=fb;const s=await F.getDoc(F.doc(db,"users",user.uid,"settings","fleet"));FLEET=s.exists()?s.data().list||[]:[]}}
else FLEET=JSON.parse(store.get("veh")||"[]");
afterDraw();
}
async function saveFleet(){
if(live){if(!user)return alert("Sign in first.");const{F}=fb;await F.setDoc(F.doc(db,"users",user.uid,"settings","fleet"),{list:FLEET})}
else store.set("veh",JSON.stringify(FLEET));
afterDraw();
}
function allVeh(){return [...new Set([...FLEET,...WO.map(w=>w.vehicle)])].sort()}
function afterDraw(){
$("vl").innerHTML=allVeh().map(v=>`<option value="${v}">`).join("");
const keep=[$("rv").value,$("rs").value];
$("rv").innerHTML='<option value="">All vehicles</option>'+allVeh().map(v=>`<option>${v}</option>`).join("");
$("rs").innerHTML='<option value="">All systems</option>'+Object.entries(SYS).map(([k,v])=>`<option value="${k}">${k} – ${v}</option>`).join("");
$("rv").value=keep[0];$("rs").value=keep[1];
$("vlist").innerHTML=allVeh().map(v=>{const n=WO.filter(w=>w.vehicle==v).length;const own=FLEET.includes(v);
return `<span class="chip">${v} <small style="color:var(--mu)">${n} WO</small>${own?`<button class="s" data-v="${v}">✕</button>`:""}</span>`}).join("")||'<span style="color:var(--mu)">No vehicles yet.</span>';
$("vlist").querySelectorAll("button").forEach(b=>b.onclick=()=>{FLEET=FLEET.filter(x=>x!=b.dataset.v);saveFleet()});
if(!$("v-admin").hidden)report();
}
function rows(){
const f=$("rf").value,t=$("rt").value,v=$("rv").value,s=$("rs").value,st=$("rst").value;
return WO.filter(w=>(!f||w.date>=f)&&(!t||w.date<=t)&&(!v||w.vehicle==v)&&(!s||w.code.slice(0,2)==s)&&(!st||w.status==st));
}
function grp(a,fn){const m={};a.forEach(w=>{const k=fn(w);const o=m[k]||(m[k]={n:0,lab:0,cost:0});o.n++;o.lab+=+w.labor||0;o.cost+=+w.cost||0});return Object.entries(m)}
function tbl(title,g,sortByKey){
g=g.sort((a,b)=>sortByKey?a[0].localeCompare(b[0]):b[1].n-a[1].n);const mx=Math.max(1,...g.map(x=>x[1].n));
return `<div class="panel"><h3>${title}</h3><div class="wrap"><table><thead><tr><th></th><th>WOs</th><th></th><th>Labor hrs</th><th>Cost</th></tr></thead><tbody>`+
(g.map(([k,o])=>`<tr><td>${k}</td><td>${o.n}</td><td style="width:25%"><div class="mb" style="width:${o.n/mx*100}%"></div></td><td>${o.lab.toFixed(1)}</td><td>${money(o.cost)}</td></tr>`).join("")||'<tr><td colspan="5" style="color:var(--mu)">No data</td></tr>')+`</tbody></table></div></div>`;
}
function report(){
const a=rows(),lab=a.reduce((s,w)=>s+(+w.labor||0),0),cost=a.reduce((s,w)=>s+(+w.cost||0),0),done=a.filter(w=>w.status=="Completed").length;
const card=(b,s)=>`<div class="stat" style="cursor:default"><b>${b}</b><span>${s}</span></div>`;
$("rsum").innerHTML=card(a.length,"Work orders")+card(done,"Completed")+card(lab.toFixed(1),"Labor hours")+card(money(cost),"Total cost")+card(a.length?money(cost/a.length):"$0.00","Avg / WO");
$("rout").innerHTML=tbl("By status",grp(a,w=>w.status))+tbl("By system",grp(a,w=>{const k=w.code.slice(0,2);return k+" – "+(SYS[k]||"")}),true)+
tbl("By vehicle",grp(a,w=>w.vehicle))+tbl("By month",grp(a,w=>w.date.slice(0,7)),true)+tbl("By work plan type",grp(a,w=>w.type||"—"))+
tbl("Top work plan codes",grp(a,w=>w.code+" "+w.desc).sort((x,y)=>y[1].n-x[1].n).slice(0,10));
}
async function dl(name,text,type){try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:name,data:new Blob([text],{type})});return}}catch(e){if(e&&e.code=="declined")return}
const u=URL.createObjectURL(new Blob([text],{type}));const e=document.createElement("a");e.href=u;e.download=name;e.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
$("rcsv").onclick=()=>{const h=["WO","Date","Vehicle","Odometer","System","Code","Description","Type","Priority","Status","Labor","Cost","Notes"];
dl("work-orders-report.csv",[h.map(esc).join(","),...rows().map(w=>[w.num,w.date,w.vehicle,w.odometer,w.code.slice(0,2),w.code,w.desc,w.type,w.priority,w.status,w.labor,w.cost,w.notes].map(esc).join(","))].join("\n"),"text/csv")};
$("rprint").onclick=()=>window.print();
["rf","rt","rv","rs","rst"].forEach(i=>$(i).onchange=report);
function view(v){$("v-dash").hidden=v!="d";$("v-admin").hidden=v!="a";$("nd").classList.toggle("on",v=="d");$("na").classList.toggle("on",v=="a");if(v=="a")report();location.hash=v=="a"?"admin":""}
$("nd").onclick=()=>view("d");$("na").onclick=()=>view("a");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));["rep","veh","dat"].forEach(k=>$("t-"+k).hidden=k!=b.dataset.t)});
$("addv").onclick=()=>{const v=$("nv").value.trim();if(v&&!FLEET.includes(v)){FLEET.push(v);$("nv").value="";saveFleet()}};
$("exj").onclick=()=>dl("work-orders-backup.json",JSON.stringify({exported:new Date().toISOString(),fleet:FLEET,workOrders:WO},null,1),"application/json");
$("imb").onclick=()=>$("imf").click();
$("imf").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());const list=d.workOrders||[];
if(live&&!user)return alert("Sign in first.");
for(const w of list){if(live){const{F}=fb,{id,...x}=w;await F.setDoc(F.doc(db,"users",user.uid,"workOrders",String(w.num)),x)}else{const i=WO.findIndex(o=>o.num==w.num);i<0?WO.push(w):WO[i]=w}}
(d.fleet||[]).forEach(v=>FLEET.includes(v)||FLEET.push(v));await saveFleet();if(!live){store.set("wo",JSON.stringify(WO));draw()}
$("dmsg").textContent=`Imported ${list.length} work orders.`}catch(x){$("dmsg").textContent="Import failed: "+x.message}e.target.value=""};
$("clr").onclick=async()=>{if(!confirm("Delete ALL work orders? This cannot be undone."))return;if(!confirm("Really delete everything?"))return;
if(live){if(!user)return alert("Sign in first.");const{F}=fb;for(const w of WO)await F.deleteDoc(F.doc(db,"users",user.uid,"workOrders",String(w.num)))}
else{WO=[];store.set("wo","[]");draw()}
$("dmsg").textContent="All work orders deleted."};
if(location.hash=="#admin")view("a");
/* ---- import codes from xlsx (used when codes.js is not present) ---- */
function chkCodes(){$("nocodes").hidden=CODES.length>0}
$("xf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
try{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("Could not load the spreadsheet reader (internet needed)"));document.head.appendChild(s)});
const wb=XLSX.read(await f.arrayBuffer()),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).slice(1)
.filter(x=>x[1]).map(x=>[String(x[0]||"").trim(),String(x[1]).trim(),String(x[2]||"").trim(),String(x[3]||"").replace(/\s+/g," ").trim()]);
if(!r.length)throw new Error("No rows found – expected columns: Type, Plan ID, Plan Name, Plan Desc");
CODES.length=0;r.forEach(x=>CODES.push(x));try{localStorage.setItem("codes",JSON.stringify(r))}catch(e){}
chkCodes();alert(r.length+" codes loaded.")}catch(err){showErr(err.message)}};
chkCodes();
try{init()}catch(e){showErr(e.message)}
</script></body></html>
