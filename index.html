<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Order Dashboard</title>
<style>
:root{--bg:#0d1a12;--card:#14281b;--line:#24402d;--g:#3fae5f;--tx:#e6f0e8;--mu:#8fa897;--am:#e0a030;--rd:#d65a4a;--bl:#4a90c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#0a140e;border-bottom:2px solid var(--g)}
h1{font-size:19px;margin:0}h1 small{color:var(--mu);font-weight:400;font-size:12px;margin-left:8px}
main{max-width:1200px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.stat b{display:block;font-size:28px}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{background:#0f2016;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit}
button{cursor:pointer}button.p{background:var(--g);color:#06150b;font-weight:700;border:0}
button.s{padding:5px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid}
.Open{color:var(--bl)}.InProgress{color:var(--g)}.WaitingParts{color:var(--am)}.Completed{color:var(--mu)}.High{color:var(--rd)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--g);border-radius:12px;width:min(680px,95vw);padding:18px}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.hit{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:4px}
.hit div{padding:6px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}.hit div:hover{background:#1d3a28}
.hit code{color:var(--g);margin-right:6px}
#note{color:var(--am);font-size:12px}
@media(max-width:560px){.f{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}header,.stats,.bar,button{display:none}}
</style></head><body>
<header><h1>🚛 Work Order Dashboard<small id="mode"></small></h1><div><span id="who"></span> <button id="auth" class="s">Sign in</button></div></header>
<main>
<div id="note"></div>
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" placeholder="Search WO #, vehicle, code, description…" style="flex:1;min-width:200px">
<select id="fs"><option value="">All status</option><option>Open</option><option>In Progress</option><option>Waiting Parts</option><option>Completed</option></select>
<button class="p" id="new">+ New Work Order</button></div>
<div class="wrap"><table><thead><tr><th>WO #</th><th>Date</th><th>Vehicle</th><th>Plan Code</th><th>Description</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<dialog id="dlg"><form method="dialog" id="form" class="f">
<div class="w"><b id="dt">New Work Order</b></div>
<div><label>Vehicle / Unit</label><input id="veh" required placeholder="e.g. Ram 3500 #1"></div>
<div><label>Odometer / Hours</label><input id="odo" type="number"></div>
<div><label>System (VSC 01–43)</label><select id="sys"></select></div>
<div><label>Work Plan Type</label><select id="typ"><option value="">Any</option><option>MANT</option><option>PREV</option><option>INSP</option><option>MINR</option><option>OTHR</option><option>OTIS</option></select></div>
<div class="w"><label>Find work plan code</label><input id="cs" placeholder="Search code or description…"><div class="hit" id="hit"></div></div>
<div class="w"><label>Selected work plan</label><input id="sel" readonly required placeholder="Pick a code above"></div>
<div><label>Priority</label><select id="pri"><option>Routine</option><option>High</option><option>Down / Out of Service</option></select></div>
<div><label>Status</label><select id="st"><option>Open</option><option>In Progress</option><option>Waiting Parts</option><option>Completed</option></select></div>
<div><label>Labor hours</label><input id="lab" type="number" step="0.1"></div>
<div><label>Parts / cost ($)</label><input id="cost" type="number" step="0.01"></div>
<div class="w"><label>Parts used / notes</label><textarea id="nt" rows="3"></textarea></div>
<div class="w"><button class="p" id="save" type="button">Save</button> <button type="button" id="del" class="s">Delete</button> <button type="button" id="x">Cancel</button></div>
</form></dialog>

 const q=$("q").value.toLowerCase(),s=$("fs").value||filt;
 const c={Open:0,"In Progress":0,"Waiting Parts":0,Completed:0};WO.forEach(w=>c[w.status]++);
 $("stats").innerHTML=Object.entries(c).map(([k,v])=>`<div class="stat" data-s="${k}"><b>${v}</b><span>${k}</span></div>`).join("")+`<div class="stat" data-s=""><b>${WO.length}</b><span>All</span></div>`;
 $("stats").querySelectorAll(".stat").forEach(e=>e.onclick=()=>{$("fs").value=e.dataset.s;draw()});
 $("rows").innerHTML=WO.filter(w=>(!s||w.status==s)&&(!q||JSON.stringify(w).toLowerCase().includes(q))).map(w=>`<tr><td>WO-${w.num}</td><td>${w.date}</td><td>${w.vehicle}</td><td><code>${w.code}</code></td><td>${w.desc}</td><td class="${w.priority=="Routine"?"":"High"}">${w.priority}</td><td><span class="tag ${w.status.replace(" ","")}">${w.status}</span></td><td><button class="s" data-id="${w.id}">Open</button></td></tr>`).join("")||'<tr><td colspan="8" style="color:var(--mu)">No work orders yet.</td></tr>';
 $("rows").querySelectorAll("button").forEach(b=>b.onclick=()=>edit(WO.find(w=>w.id==b.dataset.id)));
}
function hits(){
 const q=$("cs").value.toLowerCase(),sy=$("sys").value,t=$("typ").value;
 const r=CODES.filter(c=>(!sy||c[1].startsWith(sy))&&(!t||c[0]==t)&&(!q||(c[1]+" "+c[2]+" "+c[3]).toLowerCase().includes(q))).slice(0,60);
 $("hit").innerHTML=r.map(c=>`<div data-k="${c[0]}|${c[1]}|${c[3]}"><code>${c[1]}</code>${c[3]} <small style="color:var(--mu)">[${c[0]}]</small></div>`).join("")||"<div>No match</div>";
 $("hit").querySelectorAll("div[data-k]").forEach(d=>d.onclick=()=>{const[t,k,ds]=d.dataset.k.split("|");$("sel").value=`${k} – ${ds}`;$("sel").dataset.t=t;$("sel").dataset.k=k;$("sel").dataset.d=ds});
}
["cs","sys","typ"].forEach(i=>$(i).oninput=hits);$("q").oninput=draw;$("fs").onchange=draw;
function edit(w){cur=w||null;$("dt").textContent=w?`Work Order WO-${w.num}`:"New Work Order";
 const g=(i,v)=>$(i).value=v??"";g("veh",w?.vehicle);g("odo",w?.odometer);g("pri",w?.priority||"Routine");g("st",w?.status||"Open");g("lab",w?.labor);g("cost",w?.cost);g("nt",w?.notes);g("cs","");g("sys","");g("typ","");
 g("sel",w?`${w.code} – ${w.desc}`:"");$("sel").dataset.k=w?.code||"";$("sel").dataset.d=w?.desc||"";$("sel").dataset.t=w?.type||"";
 $("del").style.display=w?"":"none";hits();$("dlg").showModal()}
$("new").onclick=()=>edit();$("x").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
 if(!$("veh").value||!$("sel").dataset.k)return alert("Vehicle and a work plan code are required.");
 if(live&&!user)return alert("Sign in first.");
 const o={vehicle:$("veh").value,odometer:$("odo").value,code:$("sel").dataset.k,desc:$("sel").dataset.d,type:$("sel").dataset.t,system:$("sel").dataset.k.slice(0,2),priority:$("pri").value,status:$("st").value,labor:$("lab").value,cost:$("cost").value,notes:$("nt").value};
 if(cur)Object.assign(cur,o);else{const num=(Math.max(1000,...WO.map(w=>w.num))+1);Object.assign(o,{num,date:new Date().toISOString().slice(0,10),id:String(Date.now())});cur=o;WO.unshift(o)}
 if(live){const{F}=fb,col=F.collection(db,"users",user.uid,"workOrders"),{id,...d}=cur;
  await F.setDoc(F.doc(col,String(cur.num)),d)}
 else store.set(JSON.stringify(WO));
 $("dlg").close();draw()};
$("del").onclick=async()=>{if(!cur||!confirm("Delete this work order?"))return;
 if(live){const{F}=fb;await F.deleteDoc(F.doc(db,"users",user.uid,"workOrders",String(cur.num)))}
 else{WO=WO.filter(w=>w!==cur);store.set(JSON.stringify(WO))}
 $("dlg").close();draw()};
try{init()}catch(e){showErr(e.message)}
</script></body></html>
